<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クライアント一覧</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <div class="header">
    <h1>クライアント管理</h1>
    <div class="flex gap-8">
      <a href="/admin/settings.html" class="header-action" style="text-decoration:none;">設定</a>
      <button class="header-action" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div id="stats" style="display:none;" class="flex gap-8 mb-8">
    <div class="card" style="flex:1; text-align:center;">
      <div class="card-body" style="padding:10px;">
        <div style="font-size:22px; font-weight:700; color:var(--primary);" id="totalCount">0</div>
        <div class="text-sm text-muted">総クライアント</div>
      </div>
    </div>
    <div class="card" style="flex:1; text-align:center;">
      <div class="card-body" style="padding:10px;">
        <div style="font-size:22px; font-weight:700; color:var(--green);" id="activeCount">0</div>
        <div class="text-sm text-muted">進行中</div>
      </div>
    </div>
    <div class="card" style="flex:1; text-align:center;">
      <div class="card-body" style="padding:10px;">
        <div style="font-size:22px; font-weight:700; color:var(--gray-400);" id="doneCount">0</div>
        <div class="text-sm text-muted">完了</div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <input type="text" id="search" class="form-input" placeholder="名前で検索..." oninput="filterClients()">
  </div>

  <div class="card" style="overflow:hidden;">
    <div style="display:flex; border-bottom:1px solid #e2e8f0;">
      <div id="tabPasson" onclick="switchTab('passon')" class="plan-tab active" style="flex:1; padding:10px 0; text-align:center; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid var(--primary); color:var(--primary);">
        Pass on. <span id="tabPassonCount" style="background:var(--primary-light); color:var(--primary); font-size:10px; padding:1px 6px; border-radius:8px;"></span>
      </div>
      <div id="tabOther" onclick="switchTab('other')" class="plan-tab" style="flex:1; padding:10px 0; text-align:center; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; color:#999;">
        その他 <span id="tabOtherCount" style="background:#f0f0f0; color:#999; font-size:10px; padding:1px 6px; border-radius:8px;"></span>
      </div>
    </div>
    <div id="clientList">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

  <div class="mt-16">
    <button class="btn btn-primary" onclick="openAddModal()">+ クライアントを追加</button>
  </div>
</div>

<!-- Add Client Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>クライアント追加</h2>
    <div class="form-group">
      <label class="form-label">名前</label>
      <input type="text" id="newName" class="form-input" placeholder="わだちゃん">
    </div>
    <div class="form-group">
      <label class="form-label">プラン</label>
      <select id="newPlan" class="form-input">
        <option value="トライアル">トライアル</option>
        <option value="無料セッション">無料セッション</option>
        <option value="3か月">3か月</option>
        <option value="F通常">F通常</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">総セッション回数</label>
      <input type="number" id="newTotal" class="form-input" placeholder="6" min="1">
    </div>
    <div class="form-group">
      <label class="form-label">金額（円）</label>
      <input type="number" id="newPrice" class="form-input" placeholder="22000">
    </div>
    <div class="flex gap-8 mt-20">
      <button class="btn btn-outline" style="flex:1;" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" style="flex:1;" id="addBtn" onclick="addClient()">追加</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const TOKEN = localStorage.getItem('admin_token');
let allClients = [];
let currentTab = 'passon';

if (!TOKEN) location.href = '/admin/';

function headers() {
  return {
    'Authorization': 'Bearer ' + TOKEN,
    'Content-Type': 'application/json'
  };
}

function isPasson(c) {
  return c.plan === '3か月';
}

async function loadClients() {
  try {
    const res = await fetch(API + '/clients', { headers: headers() });
    if (res.status === 401) { location.href = '/admin/'; return; }
    allClients = await res.json();
    updateStats(allClients);
    updateTabCounts(allClients);
    renderCurrentTab();
  } catch (e) {
    document.getElementById('clientList').innerHTML = '<div class="card-body text-muted">接続エラー</div>';
  }
}

function updateStats(clients) {
  const el = document.getElementById('stats');
  el.style.display = 'flex';
  document.getElementById('totalCount').textContent = clients.length;
  const active = clients.filter(c => remaining(c) > 0).length;
  document.getElementById('activeCount').textContent = active;
  document.getElementById('doneCount').textContent = clients.length - active;
}

function updateTabCounts(clients) {
  const passon = clients.filter(c => isPasson(c));
  const other = clients.filter(c => !isPasson(c));
  document.getElementById('tabPassonCount').textContent = passon.length;
  document.getElementById('tabOtherCount').textContent = other.length;
}

function remaining(c) {
  return c.totalSessions - c.sessions.length;
}

function badgeHTML(c) {
  const r = remaining(c);
  if (r <= 0) return '<span class="badge badge-done">完了</span>';
  if (r <= 1) return '<span class="badge badge-warn">残' + r + '回</span>';
  return '<span class="badge badge-active">残' + r + '回</span>';
}

function switchTab(tab) {
  currentTab = tab;
  const tabP = document.getElementById('tabPasson');
  const tabO = document.getElementById('tabOther');
  if (tab === 'passon') {
    tabP.style.borderBottom = '2px solid var(--primary)';
    tabP.style.color = 'var(--primary)';
    tabO.style.borderBottom = '2px solid transparent';
    tabO.style.color = '#999';
  } else {
    tabO.style.borderBottom = '2px solid var(--primary)';
    tabO.style.color = 'var(--primary)';
    tabP.style.borderBottom = '2px solid transparent';
    tabP.style.color = '#999';
  }
  renderCurrentTab();
}

function renderCurrentTab() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = allClients.filter(c => c.name.toLowerCase().includes(q));

  if (currentTab === 'passon') {
    renderClients(filtered.filter(c => isPasson(c)));
  } else {
    renderOtherClients(filtered.filter(c => !isPasson(c)));
  }
}

function renderClients(clients) {
  const el = document.getElementById('clientList');
  if (clients.length === 0) {
    el.innerHTML = '<div class="card-body text-muted text-center">クライアントがいません</div>';
    return;
  }

  el.innerHTML = clients.map(c => `
    <div class="client-item" onclick="location.href='/admin/client.html?id=${c.id}'">
      <div>
        <div class="client-name">${esc(c.name)}</div>
        <div class="client-plan">${esc(c.plan)} / 全${c.totalSessions}回 / &yen;${c.price.toLocaleString()}</div>
        ${c.expiryDate ? '<div style="font-size:10px; color:#999; margin-top:2px;">期限: ' + esc(c.expiryDate) + '</div>' : ''}
      </div>
      <div>${badgeHTML(c)}</div>
    </div>
  `).join('');
}

function renderOtherClients(clients) {
  const el = document.getElementById('clientList');
  if (clients.length === 0) {
    el.innerHTML = '<div class="card-body text-muted text-center">クライアントがいません</div>';
    return;
  }

  const groups = {};
  for (const c of clients) {
    const plan = c.plan || 'その他';
    if (!groups[plan]) groups[plan] = [];
    groups[plan].push(c);
  }

  let html = '';
  for (const plan of Object.keys(groups)) {
    html += '<div style="font-size:11px; font-weight:600; color:#999; padding:10px 16px 4px;">' + esc(plan) + '</div>';
    for (const c of groups[plan]) {
      html += `
        <div class="client-item" onclick="location.href='/admin/client.html?id=${c.id}'">
          <div>
            <div class="client-name">${esc(c.name)}</div>
            <div class="client-plan">${esc(c.plan)} / 全${c.totalSessions}回 / &yen;${c.price.toLocaleString()}</div>
          </div>
          <div>${badgeHTML(c)}</div>
        </div>
      `;
    }
  }
  el.innerHTML = html;
}

function filterClients() {
  renderCurrentTab();
}

function openAddModal() { document.getElementById('addModal').classList.add('active'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

async function addClient() {
  const name = document.getElementById('newName').value.trim();
  const plan = document.getElementById('newPlan').value;
  const totalSessions = document.getElementById('newTotal').value;
  const price = document.getElementById('newPrice').value;

  if (!name || !totalSessions) return;

  const btn = document.getElementById('addBtn');
  btn.disabled = true;

  await fetch(API + '/clients', {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({ name, plan, totalSessions, price })
  });

  closeAddModal();
  document.getElementById('newName').value = '';
  document.getElementById('newTotal').value = '';
  document.getElementById('newPrice').value = '';
  btn.disabled = false;
  loadClients();
}

function logout() {
  localStorage.removeItem('admin_token');
  location.href = '/admin/';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('addModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddModal();
});

loadClients();
</script>
</body>
</html>
